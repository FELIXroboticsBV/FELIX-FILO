name: Linux Installer (Local)
run-name: ${{ inputs.cura_conan_version }} for Linux-X64 by @${{ github.actor }}

on:
  workflow_call:
    inputs:
      cura_conan_version:
        description: "Cura Conan Version"
        default: ""
        required: false
        type: string

      package_overrides:
        description: "List of specific packages to be used (space-separated)"
        default: ""
        required: false
        type: string

      conan_args:
        description: "Conan args"
        default: ""
        required: false
        type: string

      enterprise:
        description: "Build Cura as an Enterprise edition"
        default: false
        required: true
        type: boolean

      staging:
        description: "Use staging API"
        default: false
        required: true
        type: boolean

      operating_system:
        description: "OS"
        required: true
        default: "ubuntu-24.04"
        type: string

      private_data:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  cura-installer-create:
    name: Build linux AppImage
    runs-on: ${{ inputs.operating_system }}

    steps:
      - name: Setup the build environment
        id: setup-environment
        uses: ultimaker/cura-workflows/.github/actions/setup-build-environment@main
        with:
          conan_user: ${{ secrets.CONAN_USER }}
          conan_password: ${{ secrets.CONAN_PASS }}
          private_data: ${{ inputs.private_data }}
          install_system_dependencies: true
          repository_path: _cura_sources # we don't want the actual sources to interfere with the built conan package
          cura_workflows_branch: main

      - name: Install FELIX Conan config
        run: |
          conan config install https://github.com/FELIXroboticsBV/conan-config.git

      - name: Verify FELIX Conan profile
        run: |
          grep -n "sentry" ~/.conan2/profiles/installer.jinja || true

      - name: Set packages overrides
        id: set-overrides
        uses: ultimaker/cura-workflows/.github/actions/set-package-overrides@main
        with:
          package_overrides: ${{ inputs.package_overrides }}
          profile: installer.jinja

      - name: What recipes are in the cache
        run: |
          conan list "cura/*" -c || true
          conan list "*felix*" -c || true

      - name: Where did the spec come from
        run: |
          find . -maxdepth 4 -name "*.spec"
          grep -n "name=r" FELIX-Filo/UltiMaker-Cura.spec || true

      - name: Temp pause
        run: ...

      - name: Install AppImage builder
        run: |
          chmod +x ./Cura-workflows/runner_scripts/appimage_setup.sh
          ./Cura-workflows/runner_scripts/appimage_setup.sh
      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo -n "$GPG_PRIVATE_KEY" \
            | base64 --decode \
            | gpg --batch \
                  --yes \
                  --pinentry-mode loopback \
                  --passphrase "$GPG_PASSPHRASE" \
                  --import

      - name: Gather/build the packages
        run: conan install -verror --requires "${{ inputs.cura_conan_version != '' && inputs.cura_conan_version || format('cura/{0}@ultimaker/testing', steps.setup-environment.outputs.package_version) }}" ${{ inputs.conan_args }} --build=missing --update -of FELIX-Filo --deployer-package="*" --profile ${{ steps.set-overrides.outputs.profile }} ${{ inputs.enterprise && '-o "cura/*:enterprise=True"' || '' }} ${{ inputs.staging && '-o "cura/*:staging=True"' || '' }} ${{ inputs.private_data && '-o "cura/*:internal=True"' || '' }} -o "cura/*:skip_licenses_download=True"

      - name: Create the Cura distribution with pyinstaller
        id: prepare-distribution
        run: |
          source FELIX-Filo/conanrun.sh
          python -m venv FELIX-Filoaller_venv
          source FELIX-Filoaller_venv/bin/activate
          ls FELIX-Filo/packaging/pip_requirements_{core,installer}_*.txt | xargs -I {} pip install -r {}

          python Cura-workflows/runner_scripts/prepare_installer.py --os ${{ runner.os }} --architecture X64 ${{ inputs.enterprise && '--enterprise' || '' }} ${{ inputs.private_data && '--internal' || '' }} --summary-output "$GITHUB_STEP_SUMMARY" --variables-output "$GITHUB_OUTPUT"

          pyinstaller ./FELIX-Filo/UltiMaker-Cura.spec

      - name: Remove unused packages in blacklist from "Cura/conandata.yml"
        run: python Cura-workflows/runner_scripts/cleanup_distribution.py dist/UltiMaker-Cura --conandata _cura_sources/conandata.yml --os Linux

      - name: Create the Linux AppImage (Bash)
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          python ../FELIX-Filo/packaging/AppImage-builder/create_appimage.py ./FELIX-Filo "${{ steps.prepare-distribution.outputs.CURA_VERSION_FULL }}" "${{ steps.prepare-distribution.outputs.INSTALLER_FILENAME }}.AppImage"
          chmod +x "${{ steps.prepare-distribution.outputs.INSTALLER_FILENAME }}.AppImage"
        working-directory: dist

      - name: Upload the AppImage
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepare-distribution.outputs.INSTALLER_FILENAME }}-AppImage
          path: dist/${{ steps.prepare-distribution.outputs.INSTALLER_FILENAME }}.AppImage
          retention-days: 5

      - name: Upload the asc
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepare-distribution.outputs.INSTALLER_FILENAME }}-asc
          path: dist/${{ steps.prepare-distribution.outputs.INSTALLER_FILENAME }}.AppImage.asc
          retention-days: 5

      - name: Clean local cache
        if: ${{ always() && startsWith(inputs.operating_system, 'self-hosted') }}
        run: conan remove '*' --lru=1w -c
