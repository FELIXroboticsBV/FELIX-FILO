name: Linux Installer
run-name: ${{ inputs.cura_conan_version }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      cura_conan_version:
        description: 'Cura Conan Version'
        default: ''
        type: string
      package_overrides:
        description: 'List of specific packages to be used (space-separated)'
        default: ''
        type: string
      conan_args:
        description: 'Conan args'
        default: ''
        required: false
        type: string
      enterprise:
        description: 'Build Cura as an Enterprise edition'
        default: false
        required: true
        type: boolean
      staging:
        description: 'Use staging API'
        default: false
        required: true
        type: boolean
      operating_system:
        description: 'OS'
        required: true
        default: 'self-hosted-Ubuntu24-X64'
        type: choice
        options:
          - ubuntu-24.04
          - self-hosted-Ubuntu24-X64

jobs:
  debug-check:
    runs-on: ubuntu-latest
    steps:
      - name: Debug - Check if secret exists
        run: |
          if [ -z "${{ secrets.GPG_PRIVATE_KEY }}" ]; then
            echo "ERROR: GPG_PRIVATE_KEY secret is empty or not set!"
            exit 1
          else
            echo "SUCCESS: Secret is set (value masked in logs)"
          fi

  linux-installer:
    needs: debug-check
    uses: ultimaker/cura-workflows/.github/workflows/cura-installer-linux.yml@main
    with:
      cura_conan_version: ${{ inputs.cura_conan_version }}
      package_overrides: ${{ inputs.package_overrides }}
      conan_args: ${{ inputs.conan_args }}
      enterprise: ${{ inputs.enterprise }}
      staging: ${{ inputs.staging }}
      operating_system: ${{ inputs.operating_system }}
    secrets: inherit