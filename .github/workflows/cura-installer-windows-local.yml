name: LocalWindowsInstaller
run-name: ${{ inputs.cura_conan_version }} for Windows-X64 by @${{ github.actor }}

on:
  workflow_call:
    inputs:
      cura_conan_version:
        description: "Cura Conan Version"
        default: ""
        required: false
        type: string

      package_overrides:
        description: "List of specific packages to be used (space-separated)"
        default: ""
        required: false
        type: string

      conan_args:
        description: "Conan args"
        default: ""
        required: false
        type: string

      enterprise:
        description: "Build Cura as an Enterprise edition"
        default: false
        required: true
        type: boolean

      staging:
        description: "Use staging API"
        default: false
        required: true
        type: boolean

      operating_system:
        description: "OS"
        required: true
        default: "windows-2022"
        type: string

      private_data:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# NOTE: Windows needs bash on Path, so we can use it in the (build env setup) scripts -- you should be able to use the bash that comes in the git/../bin folder.

jobs:
  cura-installer-create:
    name: Build Windows installers
    runs-on: ${{ inputs.operating_system }}

    steps:
      - name: Setup the build environment
        id: setup-environment
        uses: ultimaker/cura-workflows/.github/actions/setup-build-environment@main
        with:
          conan_user: ${{ secrets.CONAN_USER }}
          conan_password: ${{ secrets.CONAN_PASS }}
          private_data: ${{ inputs.private_data }}
          install_system_dependencies: true
          repository_path: _cura_sources # we don't want the actual sources to interfere with the built conan package
          python_set_env_vars: false
          cura_workflows_branch: main

      - name: Install FELIX Conan config
        run: |
          conan config install https://github.com/FELIXroboticsBV/conan-config.git

      - name: Verify FELIX Conan profile
        continue-on-error: true
        run: |
          Select-String -Path "$env:USERPROFILE\.conan2\profiles\installer.jinja" -Pattern "sentry"

      - name: Set packages overrides
        id: set-overrides
        uses: ultimaker/cura-workflows/.github/actions/set-package-overrides@main
        with:
          package_overrides: ${{ inputs.package_overrides }}
          profile: installer.jinja

      - name: What recipes are in the cache
        continue-on-error: true
        run: |
          conan list "cura/*" -c
          conan list "*felix*" -c

      - name: Where did the spec come from
        continue-on-error: true
        run: |
          Get-ChildItem -Path . -Recurse -Depth 4 -Filter "*.spec"
          Select-String -Path "FELIX-Filo\UltiMaker-Cura.spec" -Pattern "name=r"

      - name: Export local FELIX Cura recipe
        run: |
          $pydir = type ../pydir.txt
          $env:PATH += ";$pydir;$pydir/Scripts"
          conan export . --user=felix --channel=release
        working-directory: ./_cura_sources

      - name: Gather/build the packages
        run: |
          $pydir = type pydir.txt
          $env:PATH += ";$pydir;$pydir/Scripts"
          conan install -verror --requires "${{ inputs.cura_conan_version != '' && inputs.cura_conan_version || format('felix-filo/{0}@felix/release', steps.setup-environment.outputs.package_version) }}" ${{ inputs.conan_args }} --build=missing --update -of FELIX-Filo --deployer-package="*" --profile ${{ steps.set-overrides.outputs.profile }}  ${{ inputs.enterprise && '-o "felix-filo/*:enterprise=True"' || '' }} ${{ inputs.staging && '-o "felix-filo/*:staging=True"' || '' }} ${{ inputs.private_data && '-o "felix-filo/*:internal=True"' || '' }}

      - name: Find the spec file
        continue-on-error: true
        run: |
          Get-ChildItem -Path . -Recurse -Depth 3 -Filter "*.spec"

      - name: Debug ls
        run: |
          Get-ChildItem -Path FELIX-Filo -Force

      - name: Debug ls root
        run: |
          Get-ChildItem -Path .

      - name: Debug tree
        run: tree FELIX-Filo /F

      - name: Create the Cura distribution with pyinstaller
        id: prepare-distribution
        shell: cmd
        run: |
          call FELIX-Filo\conanrun.bat

          python -m venv installer_venv
          call installer_venv\Scripts\Activate.bat

          python -m pip install -r FELIX-Filo\packaging\pip_requirements_core_basic.txt --no-warn-script-location
          python -m pip install -r FELIX-Filo\packaging\pip_requirements_core_hashes.txt --no-warn-script-location
          python -m pip install -r FELIX-Filo\packaging\pip_requirements_installer_basic.txt --no-warn-script-location

          python Cura-workflows\runner_scripts\prepare_installer.py --os ${{ runner.os }} --architecture X64 ${{ inputs.enterprise && '--enterprise' || '' }} ${{ inputs.private_data && '--internal' || '' }} --summary-output %GITHUB_STEP_SUMMARY% --variables-output %GITHUB_OUTPUT%

          pyinstaller FELIX-Filo\FELIX-Filo.spec

      - name: Debug confirm dist output name
        run: Get-ChildItem -Path dist -Force

      # - name: Sign the internal executables
      #   working-directory: dist/FELIX-Filo
      #   run: |
      #     & signtool sign /v /fd sha256 /tr http://timestamp.sectigo.com /td sha256 /f C:\actions-runner\code_sign.cer /csp "eToken Base Cryptographic Provider" /kc ${{ secrets.WIN_TOKEN_CONTAINER }} "CuraEngine.exe"
      #     & signtool sign /v /fd sha256 /tr http://timestamp.sectigo.com /td sha256 /f C:\actions-runner\code_sign.cer /csp "eToken Base Cryptographic Provider" /kc ${{ secrets.WIN_TOKEN_CONTAINER }} "FELIX-Filo.exe"
      #   timeout-minutes: 2

      - name: Workaround (need exact version of msvc redistributables)
        if: ${{ always() }}
        run: |
          $PRE_MSDIR="C:/Program Files/Microsoft Visual Studio"
          if ( (dir $PRE_MSDIR).Count -ne 1 ) { throw "(!!!) MULTIPLE VISUAL STUDIO VERSIONS IN '$PRE_MSDIR' -- NEED EXACTLY ONE (cant even sort since 18 > 2022 in this context) (!!!)" }
          $SELECT_MSDIR=(dir $PRE_MSDIR)[0].FullName
          if ( (dir $SELECT_MSDIR).Count -ne 1 ) { throw "(!!!) MULTIPLE VISUAL STUDIO EDITIONS IN '$SELECT_MSDIR' -- NEED EXACTLY ONE (!!!)" }
          $SELECT_EDITIONDIR=(dir $SELECT_MSDIR)[0].FullName
          $MSDIR=$SELECT_EDITIONDIR+"/VC/Redist/MSVC"
          if ( (dir -Exclude "v*" $MSDIR).Count -ne 1 ) { Write-Warning "(!!!) MULTIPLE MSVC VERSIONS IN '$MSDIR' -- WILL TRY TO COPY _LATEST_ REDISTRIBUTABLE (!!!)" }
          $MSDIR_R=(dir -Exclude "v*" $MSDIR | Sort-Object Name -Descending)[0].FullName
          $MSDIR_DLLS=(dir $MSDIR_R/x64/Microsoft.VC*.CRT)[0].FullName
          copy $MSDIR_DLLS/concrt140.dll dist/FELIX-Filo/.
          copy $MSDIR_DLLS/msvcp140.dll dist/FELIX-Filo/.
          copy $MSDIR_DLLS/msvcp140_1.dll dist/FELIX-Filo/.
          copy $MSDIR_DLLS/msvcp140_2.dll dist/FELIX-Filo/.
          copy $MSDIR_DLLS/vcruntime140.dll dist/FELIX-Filo/.
          copy $MSDIR_DLLS/vcruntime140_1.dll dist/FELIX-Filo/.

      - name: Workaround (some libs linking against python3 instead of python312)
        if: ${{ always() }}
        run: |
          copy Cura-workflows/python_dll_workaround/* dist/FELIX-Filo/.

      - name: Remove unused packages in blacklist from "Cura/conandata.yml"
        if: ${{ always() }}
        run: |
          $pydir = type pydir.txt
          $env:PATH += ";$pydir;$pydir/Scripts"
          python Cura-workflows/runner_scripts/cleanup_distribution.py dist\FELIX-Filo --conandata _cura_sources\conandata.yml --os Windows

      - name: Create the Windows exe installer (Powershell)
        if: ${{ always() }}
        run: |
          $pydir = type ../pydir.txt
          $env:PATH += ";$pydir;$pydir/Scripts"
          python ..\FELIX-Filo\packaging\NSIS\create_windows_installer.py --source_path ../FELIX-Filo --dist_path . --filename "${{steps.prepare-distribution.outputs.INSTALLER_FILENAME}}.exe" --version "${{ steps.prepare-distribution.outputs.CURA_VERSION_FULL }}"
        working-directory: dist

#      - name: Sign the Windows exe installer (Powershell)
#        run: |
#          & signtool sign /v /fd sha256 /tr http://timestamp.sectigo.com /td sha256 /f C:\actions-runner\code_sign.cer /csp "eToken Base Cryptographic Provider" /kc ${{ secrets.WIN_TOKEN_CONTAINER }} "${{steps.prepare-distribution.outputs.INSTALLER_FILENAME}}.exe"
#        working-directory: dist
#        timeout-minutes: 2

      - name: Upload the installer exe
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{steps.prepare-distribution.outputs.INSTALLER_FILENAME}}-exe
          path: dist/${{steps.prepare-distribution.outputs.INSTALLER_FILENAME}}.exe
          retention-days: 5

      - name: Create the Windows msi installer (Powershell)
        run: |
          $pydir = type ../pydir.txt
          $env:PATH += ";$pydir;$pydir/Scripts"
          python ..\FELIX-Filo\packaging\msi\create_windows_msi.py --source_path ..\FELIX-Filo --dist_path .\FELIX-Filo --filename "${{ steps.prepare-distribution.outputs.INSTALLER_FILENAME }}.msi" --name "${{ steps.prepare-distribution.outputs.CURA_APP_NAME }}" --version "${{ steps.prepare-distribution.outputs.CURA_VERSION_FULL }}"
        working-directory: dist

#      - name: Sign the Windows msi installer (Powershell)
#        run: |
#          & signtool sign /v /fd sha256 /tr http://timestamp.sectigo.com /td sha256 /f C:\actions-runner\code_sign.cer /csp "eToken Base Cryptographic Provider" /kc ${{ secrets.WIN_TOKEN_CONTAINER }} "${{steps.prepare-distribution.outputs.INSTALLER_FILENAME}}.msi"
#        working-directory: dist
#        timeout-minutes: 2

      - name: Upload the installer msi
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{steps.prepare-distribution.outputs.INSTALLER_FILENAME}}-msi
          path: dist/${{steps.prepare-distribution.outputs.INSTALLER_FILENAME}}.msi
          retention-days: 5

      - name: Upload the application exe
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: FELIX-Filo.exe
          path: dist/FELIX-Filo/FELIX-Filo.exe
          retention-days: 5

      - name: Upload the engine exe
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: CuraEngine.exe
          path: dist/FELIX-Filo/CuraEngine.exe
          retention-days: 5

      - name: Clean local cache
        if: ${{ always() && startsWith(inputs.operating_system, 'self-hosted') }}
        run: |
          $pydir = type pydir.txt
          $env:PATH += ";$pydir;$pydir/Scripts"
          conan remove '*' --lru=1w -c